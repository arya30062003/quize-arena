<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="arenaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#4f46e5" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#arenaGrad)" />

  <!-- Inner Ambient Glow Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" stroke-dasharray="12 12" />

  <!-- Trophy Icon -->
  <g filter="url(#shadow)" transform="translate(106, 106) scale(12.5)">
    <!-- Trophy Path from Lucide Trophy -->
    <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M4 22h16" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M10 14.66V17c0 .55-.45 1-1 1H7c-.55 0-1 .45-1 1v1c0 .55.45 1 1 1h10c.55 0 1-.45 1-1v-1c0-.55-.45-1-1-1h-2c-.55 0-1-.45-1-1v-2.34" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M6 2h12v7a6 6 0 0 1-12 0V2z" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" />
  </g>

  <!-- Sparkle Accent -->
  <polygon points="400,90 410,115 435,125 410,135 400,160 390,135 365,125 390,115" fill="#fde047" />
  <polygon points="110,380 116,395 131,401 116,407 110,422 104,407 89,401 104,395" fill="#fde047" />
</svg>
